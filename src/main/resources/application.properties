# Application Name
spring.application.name=hospitalapi
# Server Configuration
server.port=8080
# H2 Database Configuration
# === PostgreSQL Configuration ===

# The database URL, pointing to the 'hospitaldb' you just created
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitaldb

# Your database username (default is postgres)
spring.datasource.username=postgres

# The password you set during PostgreSQL installation
spring.datasource.password=123

# This tells Hibernate to automatically create/update tables
spring.jpa.hibernate.ddl-auto=update

# Specifies the correct SQL dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Gemini AI Configuration
gemini.api.key=your_gemini_api_key_here
gemini.api.url=https://generativelanguage.googleapis.com/v1beta

# Logging Configuration
logging.level.com.hospital.hospitalapi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.dir=uploads/prescriptions