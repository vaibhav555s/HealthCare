# ============================================================
# Production Configuration — reads from environment variables
# ============================================================

spring.application.name=hospitalapi
server.port=${PORT:8080}

# === PostgreSQL (from Render dashboard) ===
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# === Gemini AI ===
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash
gemini.api.key=${GEMINI_API_KEY:}

# === JWT ===
jwt.secret=${JWT_SECRET:ChangeThisToAStrongSecretKeyForJwtSigning}
jwt.expiration-ms=3600000

# === File Upload ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.dir=uploads/prescriptions

# === Swagger ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# === Logging ===
logging.level.com.hospital.hospitalapi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
